name: e2e
on:
  schedule:
    - cron: "0 7 * * *"  # nightly UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/manager/**"
      - "internal/runner/**"
      - "internal/orchestrator/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"

jobs:
  linux:
    strategy:
      matrix:
        distro: [ubuntu, fedora, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: make build
      - run: |
          docker build -t pkgr-e2e-${{ matrix.distro }} \
            -f tests/e2e/docker/${{ matrix.distro }}.Dockerfile .
          docker run --rm pkgr-e2e-${{ matrix.distro }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: make build
      - run: |
          ./pkgr version
          ./pkgr pm list
          ./pkgr search ripgrep --limit 5
          ./pkgr --dry-run install ripgrep@brew

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go build -o pkgr.exe ./cmd/pkgr
      - run: .\pkgr.exe version
      - run: .\pkgr.exe pm list
      - run: .\pkgr.exe --dry-run install ripgrep@scoop || echo no scoop
